name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the app
        run: dotnet build src/CluckWise/CluckWise.csproj -c Release

      - name: Run the tests
        run: dotnet test tests/CluckWise.Tests/CluckWise.Tests.csproj -c Release --logger "console;verbosity=normal"
